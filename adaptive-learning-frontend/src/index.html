<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Adaptive Learning Path Builder</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- CHANGED: F-08 — CSP: /api is proxied so 'self' covers it; no absolute backend URL needed -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self';">

  <!-- CHANGED: F-04 — Clickjacking protection (redundant with server header, belt-and-suspenders) -->
  <meta http-equiv="X-Frame-Options" content="DENY">

  <!-- CHANGED: general hardening -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>
  <app-root></app-root>
</body>
</html>
