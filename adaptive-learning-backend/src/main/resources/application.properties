server.port=8080
spring.application.name=adaptive-learning-backend

# CHANGED: B-13 — request size limits to prevent memory exhaustion
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-request-header-size=8KB

# CHANGED: B-06 — suppress verbose error details from HTTP responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── Encryption config ─────────────────────────────────────────────────────────
# Path to the RSA private key PEM file (NEVER put the key itself here).
# Override with environment variable: CRYPTO_PRIVATE_KEY_PATH=D:/nila/EncryptionDecryption/privatekey.pem
# Leaving blank disables decryption (plaintext pass-through for dev without key).
crypto.private-key-path=${CRYPTO_PRIVATE_KEY_PATH:}
